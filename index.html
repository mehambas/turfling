<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Halı Saha Turnuvası</title>
  <link rel="icon" href="icons/app-small.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/app-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Halı Saha">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span id="brand-title" class="brand-title">Halı Saha Turnuvası</span>
      </div>
      <nav class="tabs" role="tablist" aria-label="Bölümler">
        <button class="tab" role="tab" data-action="tab" data-tab="dashboard"><span class="tab-dot" aria-hidden="true"></span>Turnuva</button>
        <button class="tab" role="tab" data-action="tab" data-tab="fixtures">Fikstür</button>
        <button class="tab" role="tab" data-action="tab" data-tab="setup">Kurulum</button>
      </nav>
      <div class="tools">
        <button class="live-pill" id="live-pill" data-action="live-open" hidden></button>
        <a class="icon-btn tool-screen" href="#ekran" target="_blank" aria-label="Yayın ekranını yeni pencerede aç" title="Yayın ekranı (TV / projektör)"></a>
        <button class="icon-btn" data-action="toggle-sound"></button>
        <button class="icon-btn" data-action="toggle-theme"></button>
      </div>
    </div>
  </header>

  <div class="live-bar" id="live-bar" role="status" hidden></div>

  <main id="view" class="view"></main>

  <dialog id="dialog" class="dialog"></dialog>
  <dialog id="sheet" class="iz-dialog" aria-labelledby="iz-sheet-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="js/tournament.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/crests.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
