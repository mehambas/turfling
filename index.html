<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Halı Saha Turnuvası</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230A4D32'/%3E%3Ccircle cx='12' cy='12' r='7' fill='none' stroke='%23B7F34A' stroke-width='1.8'/%3E%3Cpath d='m12 8.6 3 2.2-1.1 3.5h-3.8L9 10.8z' fill='none' stroke='%23B7F34A' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span id="brand-title" class="brand-title">Halı Saha Turnuvası</span>
      </div>
      <nav class="tabs" role="tablist" aria-label="Bölümler">
        <button class="tab" role="tab" data-action="tab" data-tab="dashboard"><span class="tab-dot" aria-hidden="true"></span>Turnuva</button>
        <button class="tab" role="tab" data-action="tab" data-tab="fixtures">Fikstür</button>
        <button class="tab" role="tab" data-action="tab" data-tab="setup">Kurulum</button>
      </nav>
      <div class="tools">
        <button class="live-pill" id="live-pill" data-action="live-open" hidden></button>
        <a class="icon-btn tool-screen" href="#ekran" target="_blank" aria-label="Yayın ekranını yeni pencerede aç" title="Yayın ekranı (TV / projektör)"></a>
        <button class="icon-btn" data-action="toggle-sound"></button>
        <button class="icon-btn" data-action="toggle-theme"></button>
      </div>
    </div>
  </header>

  <div class="live-bar" id="live-bar" role="status" hidden></div>

  <main id="view" class="view"></main>

  <dialog id="dialog" class="dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="js/tournament.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
